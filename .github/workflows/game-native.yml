name: Native game image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - apps/api/**
      - apps/frontend/**
      - bun.lock
      - ops/production/game-entrypoint.sh
      - scripts/native_game_smoke.py
      - .github/workflows/game-native.yml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - THIRD_PARTY_LICENSES.txt
      - ops/production/docker-compose.yml
      - package.json
      - apps/marketing_site/package.json
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - apps/api/**
      - apps/frontend/**
      - bun.lock
      - ops/production/game-entrypoint.sh
      - scripts/native_game_smoke.py
      - .github/workflows/game-native.yml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - THIRD_PARTY_LICENSES.txt
      - ops/production/docker-compose.yml
      - package.json
      - apps/marketing_site/package.json

permissions:
  contents: read

concurrency:
  group: native-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require a native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the actual production image without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: production
          platforms: linux/arm64
          push: false
          load: true
          tags: rngwars-native:${{ github.sha }}
          build-args: |
            VITE_POSTHOG_KEY=
            VITE_SENTRY_DSN=
      - name: Verify native API, SQLite and restart behavior with disposable data
        env:
          TEST_IMAGE: rngwars-native:${{ github.sha }}
        run: python3 scripts/native_game_smoke.py "$TEST_IMAGE"
      - name: Retain bounded native evidence, never the fixture database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-game-runtime
          path: ${{ runner.temp }}/native-game-result.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
