name: Native game image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sqlite-backup.py
      - scripts/backup_policy.py
      - Dockerfile
      - .dockerignore
      - apps/api/**
      - apps/frontend/**
      - bun.lock
      - ops/production/game-entrypoint.sh
      - scripts/native_game_smoke.py
      - .github/workflows/game-native.yml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - THIRD_PARTY_LICENSES.txt
      - ops/production/docker-compose.yml
      - package.json
      - apps/marketing_site/package.json
      - scripts/native_multiplayer_smoke.js
      - scripts/game_updater.py
      - scripts/game_recovery.py
      - scripts/game_ssh_dispatch.py
      - scripts/game_deploy_authority.py
      - scripts/game_release.py
      - scripts/game_network.py
      - scripts/sqlite-backup-schedule.py
      - scripts/native_updater_smoke.py
      - scripts/tests/test_game_updater.py
      - scripts/tests/test_game_deploy_authority.py
      - scripts/tests/test_game_release.py
      - scripts/tests/test_game_artifact.py
      - scripts/tests/fixtures/**
  pull_request:
    branches: [main]
    paths:
      - scripts/sqlite-backup.py
      - scripts/backup_policy.py
      - Dockerfile
      - .dockerignore
      - apps/api/**
      - apps/frontend/**
      - bun.lock
      - ops/production/game-entrypoint.sh
      - scripts/native_game_smoke.py
      - .github/workflows/game-native.yml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - THIRD_PARTY_LICENSES.txt
      - ops/production/docker-compose.yml
      - package.json
      - apps/marketing_site/package.json
      - scripts/native_multiplayer_smoke.js
      - scripts/game_updater.py
      - scripts/game_recovery.py
      - scripts/game_ssh_dispatch.py
      - scripts/game_deploy_authority.py
      - scripts/game_release.py
      - scripts/game_network.py
      - scripts/sqlite-backup-schedule.py
      - scripts/native_updater_smoke.py
      - scripts/tests/test_game_updater.py
      - scripts/tests/test_game_deploy_authority.py
      - scripts/tests/test_game_release.py
      - scripts/tests/test_game_artifact.py
      - scripts/tests/fixtures/**

permissions:
  contents: read

concurrency:
  group: native-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require a native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the actual production image without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: production
          platforms: linux/arm64
          push: false
          load: true
          tags: rngwars-native:${{ github.sha }}
          build-args: |
            VITE_POSTHOG_KEY=
            VITE_SENTRY_DSN=
      - name: Install native Restic for isolated encrypted recovery verification
        run: |
          set -eu
          version=0.19.1
          cd "$RUNNER_TEMP"
          asset="restic_${version}_linux_arm64.bz2"
          base="https://github.com/restic/restic/releases/download/v${version}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --retry-max-time 120 --connect-timeout 10 --max-time 60 "$base/$asset" -o "$asset"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --retry-max-time 120 --connect-timeout 10 --max-time 60 "$base/SHA256SUMS" -o SHA256SUMS
          grep " $asset$" SHA256SUMS | sha256sum --check --strict
          mkdir -p restic-bin
          bzip2 --decompress --stdout "$asset" > restic-bin/restic
          chmod 0555 restic-bin/restic
          echo "$RUNNER_TEMP/restic-bin" >> "$GITHUB_PATH"
      - name: Verify native initialization, encrypted recovery, API and restart behavior
        env:
          TEST_IMAGE: rngwars-native:${{ github.sha }}
        run: python3 scripts/native_game_smoke.py "$TEST_IMAGE"
      - name: Exercise the guarded updater and captured rollback on real native containers
        env:
          TEST_IMAGE: rngwars-native:${{ github.sha }}
        run: |
          sudo env PATH="$PATH" HOME=/root GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            RUNNER_TEMP="$RUNNER_TEMP" python3 scripts/native_updater_smoke.py "$TEST_IMAGE"
      - name: Retain bounded native evidence, never the fixture database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-game-runtime
          path: ${{ runner.temp }}/native-game-result.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-game-updater
          path: ${{ runner.temp }}/native-updater-result.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
