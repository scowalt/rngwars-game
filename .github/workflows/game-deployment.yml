name: Game private preflight

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main controller commit
        required: true
        type: string
      ci_run_id:
        description: Successful fresh main CI run for that controller
        required: true
        type: string
      image_source_revision:
        description: Exact source commit of the published image
        required: true
        type: string
      image_digest:
        description: Exact sha256 image digest
        required: true
        type: string
      publication_run_id:
        description: Successful first-attempt game publication run
        required: true
        type: string
      operation:
        description: Release verification or separately reviewed private transport only
        type: choice
        default: verify-release
        options:
          - verify-release
          - private-preflight

permissions:
  contents: read

concurrency:
  group: rngwars-game-private-preflight
  cancel-in-progress: false

env:
  APPROVED_REVISION: ${{ inputs.revision }}
  SOURCE_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GAME_PREFLIGHT_OPERATION: ${{ inputs.operation }}
  GAME_PRIVATE_PREFLIGHT_ENABLED: ${{ vars.GAME_PRIVATE_PREFLIGHT_ENABLED }}
  IMAGE_SOURCE_REVISION: ${{ inputs.image_source_revision }}
  EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
  PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve trusted main controller and existing protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/game_network.py resolve
      - name: Fetch and verify the exact public release without account credentials
        run: |
          set -eu
          python3 scripts/game_release.py fetch "$RUNNER_TEMP/game-private-evidence" \
            --revision "$IMAGE_SOURCE_REVISION" \
            --digest "$EXPECTED_IMAGE_DIGEST" \
            --publication-run "$PUBLICATION_RUN_ID" > "$RUNNER_TEMP/game-private-release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RUNNER_TEMP"], "game-private-release.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write("## Verified game release\n\n")
              stream.write("Image: `" + receipt["image"] + "`\n\n")
              stream.write("Source: `" + receipt["source_revision"] + "`\n\n")
              stream.write("Publication run: " + str(receipt["publication_run_id"]) + "\n\n")
              stream.write("Private preflight tests transport only. No game deployment or data mutation is authorized.\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-private-release.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  preflight:
    name: Private transport preflight
    if: inputs.operation == 'private-preflight'
    needs: resolve
    environment: game-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck trusted source before installing the private-network client
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/game_network.py resolve
      - name: Install pinned native Tailscale client without changing system services
        run: |
          set -eu
          umask 077
          version=1.104.1
          tools="$RUNNER_TEMP/rngwars-tailscale-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$tools"
          archive="$tools/tailscale.tgz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --max-filesize 104857600 \
            "https://pkgs.tailscale.com/stable/tailscale_${version}_amd64.tgz" -o "$archive"
          printf '%s  %s\n' '108d1d96ecf410d305571e173516f27038f870919a9b89c914a167c6d33a4528' "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tools" --no-same-owner --no-same-permissions
          printf '%s\n' "$tools/tailscale_${version}_amd64" >> "$GITHUB_PATH"
      - name: Verify ephemeral OIDC and restricted private transport
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_NETWORK_BINDING: ${{ secrets.GAME_NETWORK_BINDING }}
          GAME_SSH_PRIVATE_KEY: ${{ secrets.GAME_SSH_PRIVATE_KEY }}
        run: python3 scripts/game_network.py probe > "$RUNNER_TEMP/game-private-network-result.json"
      - name: Remove only this run's private daemon and credentials
        if: always()
        run: python3 scripts/game_network.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-private-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-private-network-result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
