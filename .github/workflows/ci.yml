name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release, production]
  pull_request:
    branches: [main, release, production]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ASTRO_TELEMETRY_DISABLED: "1"
  VITE_POSTHOG_KEY: ""
  VITE_SENTRY_DSN: ""
  PUBLIC_POSTHOG_KEY: ""
  SENTRY_DSN: ""

jobs:
  build-api:
    name: Build API (F#)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.401"
      - name: Restore
        run: dotnet restore apps/api.tests/RNGWars.Api.Tests.fsproj
      - name: Build
        run: dotnet build apps/api.tests/RNGWars.Api.Tests.fsproj --no-restore --warnaserror
      - name: Test portable backend and synthetic SQLite coverage
        run: dotnet test apps/api.tests/RNGWars.Api.Tests.fsproj --no-build --no-restore --filter 'FullyQualifiedName!~ApiHttpTests'
      - name: Report coverage boundary
        run: echo 'Portable tests only. HTTP fixtures, containers and deployment are not run; see docs/testing.md.' >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    name: Build Frontend (SolidJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test frontend
        run: bun run --cwd apps/frontend test --maxWorkers=2
      - name: Build frontend
        run: bun run --cwd apps/frontend build
      - name: Check marketing site
        run: bun run --cwd apps/marketing_site check
      - name: Build marketing site
        run: bun run build:marketing

  portable-sqlite-ops:
    name: Portable SQLite backup and deployment preparation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - name: Install tested Restic from official checksums
        run: |
          set -eu
          version=0.19.1
          cd "$RUNNER_TEMP"
          asset="restic_${version}_linux_amd64.bz2"
          base="https://github.com/restic/restic/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$asset" -o "$asset"
          curl --fail --silent --show-error --location "$base/SHA256SUMS" -o SHA256SUMS
          grep " $asset$" SHA256SUMS | sha256sum --check --strict
          mkdir -p restic-bin
          bzip2 --decompress --stdout "$asset" > restic-bin/restic
          chmod 0555 restic-bin/restic
          echo "$RUNNER_TEMP/restic-bin" >> "$GITHUB_PATH"
      - name: Test transfer and isolated encrypted local backups
        run: uv run --no-project --python 3.14 python -W default::ResourceWarning -m unittest discover -s scripts/tests -v
      - name: Test synthetic configuration and rendered scheduler units
        run: uv run --no-project --python 3.14 --with-requirements ops/tests/requirements.txt python -W default::ResourceWarning -m unittest discover -s ops/tests -v
      - name: Report independent live gates
        run: |
          echo 'Synthetic/local checks only. No live R2, provider plan/apply, installed scheduler, publication or deployment ran.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real HTTP remains separately gated by Portless/private Tailscale. Hosted test results do not prove backup recoverability or game recovery.' >> "$GITHUB_STEP_SUMMARY"
