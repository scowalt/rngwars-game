name: Game image publication

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_revision:
        description: Exact current main revision approved for this candidate
        type: string
        required: true
      source_ci_run_id:
        description: Successful first-attempt current-main CI run from the last day
        type: string
        required: true
      operation:
        description: Manual validation does not publish or deploy
        type: choice
        options: [validate]
        default: validate
        required: true

permissions:
  contents: read

concurrency:
  group: game-image-publication
  cancel-in-progress: false

env:
  APPROVED_REVISION: ${{ github.event_name == 'workflow_run' && github.sha || inputs.approved_revision }}
  SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_ci_run_id }}
  GAME_PUBLICATION_OPERATION: ${{ github.event_name == 'workflow_run' && 'publish' || 'validate' }}
  GAME_PUBLICATION_ENABLED: ${{ vars.GAME_PUBLICATION_ENABLED }}
  GAME_AUTOMATIC_CD_ENABLED: ${{ vars.GAME_AUTOMATIC_CD_ENABLED }}

jobs:
  resolve:
    if: >-
      github.repository_id == '1442331254' && github.actor_id == '1100550' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && vars.GAME_AUTOMATIC_CD_ENABLED == 'true' &&
      vars.GAME_PUBLICATION_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == 1442331254 &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_revision: ${{ steps.resolve.outputs.source_revision }}
      eligible: ${{ steps.resolve.outputs.eligible }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact approved main CI
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/game_publication.py resolve

  native-build:
    name: Build and exercise native image
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          persist-credentials: false
      - name: Prepare isolated native tools and output
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
          mkdir -m 0700 "$RUNNER_TEMP/game-candidate"
          version=0.19.1
          cd "$RUNNER_TEMP"
          asset="restic_${version}_linux_arm64.bz2"
          base="https://github.com/restic/restic/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$asset" -o "$asset"
          curl --fail --silent --show-error --location "$base/SHA256SUMS" -o SHA256SUMS
          grep " $asset$" SHA256SUMS | sha256sum --check --strict
          mkdir -p restic-bin
          bzip2 --decompress --stdout "$asset" > restic-bin/restic
          chmod 0555 restic-bin/restic
          echo "$RUNNER_TEMP/restic-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the production OCI image without publication or signing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: production
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/game-candidate/image.oci.tar,oci-mediatypes=true,compression=gzip
          labels: |
            org.opencontainers.image.source=https://github.com/scowalt/rngwars-game
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_POSTHOG_KEY=
            VITE_SENTRY_DSN=
      - name: Validate OCI identity and exercise the exact native image
        run: |
          set -eu
          python3 scripts/game_artifact.py inspect "$RUNNER_TEMP/game-candidate/image.oci.tar" --revision "$GITHUB_SHA"
          skopeo --override-os linux --override-arch arm64 copy "oci-archive:$RUNNER_TEMP/game-candidate/image.oci.tar" "docker-daemon:rngwars-native:$GITHUB_SHA"
          python3 scripts/native_game_smoke.py "rngwars-native:$GITHUB_SHA"
          test ! -e "$RUNNER_TEMP/game-candidate/native-game-result.json"
          mv "$RUNNER_TEMP/native-game-result.json" "$RUNNER_TEMP/game-candidate/native-game-result.json"
          python3 scripts/game_artifact.py verify-native "$RUNNER_TEMP/game-candidate/image.oci.tar" --revision "$GITHUB_SHA" --native-receipt "$RUNNER_TEMP/game-candidate/native-game-result.json"
      - name: Retain only the clean image and bounded synthetic receipt
        id: candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  prepare:
    needs: [resolve, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.prepare.outputs.eligible }}
      image_sha256: ${{ steps.prepare.outputs.image_sha256 }}
      archive_sha256: ${{ steps.prepare.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently validate provider identity and native artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.native-build.outputs.artifact_id }}
        run: python3 scripts/game_publication.py prepare "$RUNNER_TEMP/accepted-game" --artifact-id "$SOURCE_ARTIFACT_ID"
      - name: Show the exact candidate before automatic publication
        if: steps.prepare.outputs.eligible == 'true'
        env:
          IMAGE_SHA256: ${{ steps.prepare.outputs.image_sha256 }}
          ARCHIVE_SHA256: ${{ steps.prepare.outputs.archive_sha256 }}
        run: |
          printf 'Source: %s\nImage: sha256:%s\nOCI archive: %s\nNo publication or deployment performed by this job.\n' "$GITHUB_SHA" "$IMAGE_SHA256" "$ARCHIVE_SHA256" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [resolve, native-build, prepare]
    if: github.event_name == 'workflow_run' && needs.prepare.outputs.eligible == 'true'
    environment: game-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install registry transport before credential use
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
      - name: Prepare isolated registry credential home
        id: credential-home
        run: |
          set -eu
          umask 077
          home="$RUNNER_TEMP/game-registry-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$home"
          printf '%s\n' "$GITHUB_RUN_ID" > "$home/.game-publication-home-owner"
          printf 'GAME_PUBLICATION_HOME=%s\nDOCKER_CONFIG=%s/.docker\n' "$home" "$home" >> "$GITHUB_ENV"
      - name: Recheck main push authority, reserve the attempt and publish the exact digest
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.native-build.outputs.artifact_id }}
          EXPECTED_IMAGE_DIGEST: sha256:${{ needs.prepare.outputs.image_sha256 }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: python3 scripts/game_publication.py publish "$RUNNER_TEMP/publication-candidate" --artifact-id "$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/game-publication-published.json"
      - name: Attest the published image from the trusted-main job
        if: steps.push.outputs.image_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        env:
          HOME: ${{ env.GAME_PUBLICATION_HOME }}
        with:
          subject-name: ghcr.io/scowalt/rngwars-game-releases
          subject-digest: sha256:${{ steps.push.outputs.image_sha256 }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false
      - name: Verify genuine registry provenance and exact invocation
        if: steps.push.outputs.image_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/game_publication.py verify-published "$RUNNER_TEMP/game-publication-published.json" > "$RUNNER_TEMP/game-publication-verified.json"
      - name: Retain bounded public publication evidence
        if: steps.push.outputs.image_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-publication-verified.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Remove this job's registry authentication file
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import stat
          home = Path(os.environ["RUNNER_TEMP"]) / ("game-registry-auth-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          if home.exists() or home.is_symlink():
              info = home.lstat()
              assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.geteuid() and stat.S_IMODE(info.st_mode) == 0o700
              marker = home / ".game-publication-home-owner"
              info = marker.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid() and info.st_nlink == 1 and stat.S_IMODE(info.st_mode) == 0o600
              assert marker.read_text() == os.environ["GITHUB_RUN_ID"] + "\n"
              shutil.rmtree(home)
          PY
