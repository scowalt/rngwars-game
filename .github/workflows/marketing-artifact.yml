name: Marketing artifact

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful same-repository push/manual CI run, not a PR merge run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: marketing-artifact-${{ github.event.workflow_run.head_branch || inputs.ci_run_id }}
  cancel-in-progress: false

env:
  SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

jobs:
  resolve:
    if: >-
      github.repository_id == '1442331254' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_revision: ${{ steps.source.outputs.source_revision }}
      source_branch: ${{ steps.source.outputs.source_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Resolve exact tested source using trusted-main code
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/marketing_producer.py resolve

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_POSTHOG_KEY: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: controller
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_revision }}
          path: source
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"
      - name: Build without production, signing or private-network capabilities
        run: |
          set -eu
          bun install --cwd source --frozen-lockfile --ignore-scripts
          bun run --cwd source/apps/marketing_site check
          bun run --cwd source/apps/marketing_site build
          cp source/LICENSE source/apps/marketing_site/dist/license.txt
          cp source/THIRD_PARTY_LICENSES.txt source/apps/marketing_site/dist/third-party-licenses.txt
          python3 controller/scripts/marketing_producer.py pack source/apps/marketing_site/dist "$RUNNER_TEMP/assets.zip"
      - name: Upload untrusted asset bytes for independent inspection
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-unsealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: false

  seal:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Independently bind source and validate artifact bytes without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: python3 scripts/marketing_producer.py seal "$RUNNER_TEMP/release/release.zip"
      - name: Attest only the independently prepared bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/release/release.zip
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Verify authentic signature with bounded read-only consistency retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/marketing_producer.py verify "$RUNNER_TEMP/release/release.zip"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done
          exit 1
      - name: Upload the signed release candidate, never deploy it
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/release.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: false
