services:
  game:
    image: ${RNGWARS_GAME_IMAGE:?Set the separately approved immutable game image digest}
    container_name: rngwars-game
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RNGWARS_BIND_PORT:?Set the approved loopback port}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_PATH: /data/game.sqlite3
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - type: bind
        source: ${RNGWARS_DATA_DIRECTORY:?Set the approved existing private data directory}
        target: /data
        bind:
          create_host_path: false
    labels:
      logging: "true"
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  alloy:
    image: ${RNGWARS_ALLOY_IMAGE:?Set the approved observability image}
    profiles: [observability]
    container_name: rngwars-alloy
    restart: unless-stopped
    privileged: true
    network_mode: host
    dns:
      - ${RNGWARS_DNS_RESOLVER:?Set the approved host resolver}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    environment:
      OBSERVABILITY_PROJECT: ${OBSERVABILITY_PROJECT:?Set the approved telemetry label}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_API_KEY: ${LOKI_API_KEY:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      PROMETHEUS_USERNAME: ${PROMETHEUS_USERNAME:-}
      PROMETHEUS_API_KEY: ${PROMETHEUS_API_KEY:-}
    command:
      - run
      - /etc/alloy/config.alloy
      - --stability.level=generally-available
